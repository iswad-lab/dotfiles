name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: .local share

      - name: Bash syntax
        run: |
          for f in $(find . -name "*.sh"); do
            if head -1 "$f" | grep -q bash; then
              bash -n "$f" && echo "✓ $f" || exit 1
            fi
          done

      - name: Validate JSON
        run: |
          for f in $(find . -name "*.json"); do
            jq empty "$f" && echo "✓ $f" || exit 1
          done
