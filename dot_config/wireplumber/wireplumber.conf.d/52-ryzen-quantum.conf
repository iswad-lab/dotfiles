# Ryzen HD Audio Controller (onboard) — larger per-node quantum.
# The global default quantum is 64 (suits the RME Babyface Pro FS);
# the onboard Ryzen card underruns at 64, so force a bigger quantum
# for those nodes only.  node.quantum.bounds = [ min max ] applies to
# graph-driver / own-buffer nodes; for regular ALSA sinks use
# node.quantum.min/max so the node requests a ~256-sample period
# instead of inheriting the tight 64 global floor.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_07_00.6.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        node.quantum.min = 256
        node.quantum.max = 256
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.pci-0000_07_00.6.HiFi__Mic1__source" }
      { node.name = "~alsa_input.pci-0000_07_00.6.HiFi__Mic2__source" }
    ]
    actions = {
      update-props = {
        node.quantum.min = 256
        node.quantum.max = 256
      }
    }
  }
]
