context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 64
    # Do NOT pin min-max here: a rigid 64 floor forces the onboard Ryzen
    # card to 64 too.  Per-node quantum (see wireplumber
    # 52-ryzen-quantum.conf) overrides this for the Ryzen nodes only.
    # default.clock.min-quantum  = 64
    # default.clock.max-quantum  = 64
}
